# ==============================================================================
# pizza-demo.novixa.dev — site block for mailcow's nginx on the Novixa VPS.
#
# MANAGED BY CI: scripts/remote-deploy.sh installs this file to
# /opt/mailcow-dockerized/data/conf/nginx/pizza-demo.conf whenever it changes,
# runs `nginx -t` and restores the previous file if the test fails, so a bad
# edit can never take down mailcow's nginx (webmail, novixa.dev, aqar-demo…).
# Edit it in the repository, not on the server.
#
# It only answers for pizza-demo.novixa.dev; every other host is untouched.
# ==============================================================================

server {
    listen 80;
    server_name pizza-demo.novixa.dev;
    return 301 https://pizza-demo.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pizza-demo.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — this site's own copy.
    ssl_certificate     /etc/nginx/conf.d/pizza-demo/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/pizza-demo/origin.key;

    # Real visitor IP, believed only from Cloudflare's published ranges
    # (https://www.cloudflare.com/ips/). Used by the PIN-lockout rate limit.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Payment receipt photos are uploaded via server actions (app limit: 9 MB)
    client_max_body_size 10m;

    # Resolved per request through Docker's DNS, so mailcow's nginx still starts
    # when the app container is down (this site then answers 502 instead).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pizza_demo_app http://pizza-demo-app:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (never append) so clients cannot spoof the IP used for rate limiting.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;

    # Live order updates use Server-Sent Events: never buffer, keep the stream open.
    location /api/orders/stream {
        proxy_pass $pizza_demo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Immutable build assets
    location /_next/static/ {
        proxy_pass $pizza_demo_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $pizza_demo_app;
        proxy_read_timeout 60s;
    }
}
