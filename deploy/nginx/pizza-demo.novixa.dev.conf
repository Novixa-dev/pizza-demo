# Nginx vhost for pizza-demo.novixa.dev  →  Next.js container on 127.0.0.1:__APP_PORT__
# Installed by deploy/scripts/server-setup.sh into /etc/nginx/sites-available/.

upstream pizza_demo_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen … http2" keeps compatibility with Nginx < 1.25 (Ubuntu 22.04/24.04 packages)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    # Real client IPs behind Cloudflare (https://www.cloudflare.com/ips/)
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pizza_demo_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Payment receipt photos are uploaded via server actions (app limit: 9 MB)
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    access_log /var/log/nginx/pizza-demo.access.log;
    error_log  /var/log/nginx/pizza-demo.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (never append) so clients cannot spoof the IP used for PIN-lockout rate limiting.
    # $remote_addr is the real visitor IP, restored from CF-Connecting-IP for Cloudflare peers only.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Live order updates use Server-Sent Events: never buffer, keep the stream open.
    location /api/orders/stream {
        proxy_pass http://pizza_demo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Immutable build assets
    location /_next/static/ {
        proxy_pass http://pizza_demo_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://pizza_demo_app;
        proxy_read_timeout 60s;
    }
}
