# Production stack for pizza-house.novixa.dev
# Lives on the VPS at /opt/pizza-house/docker-compose.yml (synced by the deploy workflow).
name: pizza-house

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/novixa-dev/pizza-house-website}:${APP_TAG:-latest}
    container_name: pizza-house-app
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/pizza-house.db
    ports:
      # Bound to loopback only: Nginx terminates TLS and proxies to it.
      - "127.0.0.1:${APP_PORT:-3066}:3000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
