# Production stack for pizza-demo.novixa.dev
# Lives on the VPS at /opt/pizza-demo/docker-compose.yml (synced by the deploy workflow).
name: pizza-demo

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/novixa-dev/pizza-demo}:${APP_TAG:-latest}
    container_name: pizza-demo-app
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/pizza-demo.db
    ports:
      # Loopback only, for on-host checks. Public traffic arrives through mailcow's
      # nginx over the pizza-demo-edge network (deploy/nginx/pizza-demo.mailcow.conf).
      - "127.0.0.1:${APP_PORT:-3066}:3000"
    networks:
      - edge
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Shared only with mailcow's nginx; created by scripts/remote-deploy.sh.
  edge:
    external: true
    name: pizza-demo-edge
