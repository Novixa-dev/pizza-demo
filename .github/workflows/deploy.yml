name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image tag (e.g. sha-1a2b3c4) instead of building"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_URL: https://pizza-house.novixa.dev

jobs:
  ci:
    if: github.event.inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & publish image
    needs: ci
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=pizza-house-website
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Contabo VPS
    needs: [image]
    if: always() && (needs.image.result == 'success' || github.event.inputs.image_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check server credentials
        id: creds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning title=Deploy skipped::Add VPS_HOST, VPS_USER and VPS_SSH_KEY repository secrets (see docs/DEPLOYMENT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release
        if: steps.creds.outputs.ready == 'true'
        id: release
        run: |
          echo "image=${{ needs.image.outputs.image || format('ghcr.io/{0}', github.repository) }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.image_tag || needs.image.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Upload compose stack
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.yml,deploy/scripts/remote-deploy.sh
          target: /opt/pizza-house
          strip_components: 1
          overwrite: true

      - name: Roll out (auto-rollback on failed health check)
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script: bash /opt/pizza-house/scripts/remote-deploy.sh "$IMAGE" "$TAG"

      - name: Public smoke test
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$APP_URL/api/health" | tee /dev/stderr | grep -q '"status":"ok"'; then
              curl -fsS -o /dev/null --max-time 15 "$APP_URL/" && curl -fsS -o /dev/null --max-time 15 "$APP_URL/menu"
              echo "✅ $APP_URL is live"; exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL did not become healthy (check DNS/Cloudflare/Nginx)"; exit 1
